gated_camera_recognizer:
  ros__parameters:
    image_topic: /gated_camera/image_raw
    depth_topic: /depth_camera/depth/image_raw
    camera_info_topic: /gated_camera/camera_info
    output_prefix: gated_camera
    frame_id: gated_camera_link
    detection_input: raw
    yolo_model_path: "" # sim.launch.py sets src/usv_bringup/models/best.onnx by default.
    yolo_input_width: 640
    yolo_input_height: 640
    yolo_nms_threshold: 0.45
    # Current src/usv_bringup/models/best.onnx metadata:
    # {0: buoy, 1: debris_container, 2: fishing_boat, 3: floating_obstacle, 4: platform, 5: vessel}.
    # Keep this list in the exact model output order; detection PointCloud2 class_id uses this order.
    class_names: [buoy, debris_container, fishing_boat, floating_obstacle, platform, vessel]
    confidence_threshold: 0.10
    enable_yolo_empty_contour_fallback: true
    enable_dehaze: true
    dehaze_strength: 0.65
    dehaze_omega: 0.88
    dehaze_min_transmission: 0.18
    dehaze_depth_beta: 0.018
    base_frame: base_link
    camera_x_offset: 1.55
    camera_y_offset: 0.0
    camera_z_offset: 1.20
    camera_horizontal_fov: 1.20
    camera_fx: 0.0
    camera_fy: 0.0
    camera_cx: 0.0
    camera_cy: 0.0
    camera_calibration_width: 0.0
    camera_calibration_height: 0.0
    use_tf_transform: true
    use_camera_info: true
    depth_roi_shrink: 0.20
    min_contour_area: 260.0
    process_stride: 1
    gate_near: [2.0, 18.0]
    gate_mid: [12.0, 42.0]
    gate_far: [32.0, 85.0]


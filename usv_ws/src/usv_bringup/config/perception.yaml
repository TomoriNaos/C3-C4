gated_slice_fusion_recognizer:
  ros__parameters:
    near_topic: /gated_camera/slice_near
    mid_topic: /gated_camera/slice_mid
    far_topic: /gated_camera/slice_far
    output_prefix: gated_camera/stf_fusion
    frame_id: gated_camera_link
    base_frame: base_link
    process_stride: 2
    confidence_threshold: 0.22
    min_contour_area: 260.0
    camera_x_offset: 1.55
    camera_y_offset: 0.0
    camera_z_offset: 1.20
    camera_horizontal_fov: 1.20
    # STF gated camera calibration: 1280x720, fx=fy=2322.4, cx=667.777, cy=261.144.
    # Keep these at 0.0 in the Gazebo camera path so the node uses the simulated camera FOV.
    camera_fx: 0.0
    camera_fy: 0.0
    camera_cx: 0.0
    camera_cy: 0.0
    camera_calibration_width: 0.0
    camera_calibration_height: 0.0
    gate_near: [2.0, 18.0]
    gate_mid: [12.0, 42.0]
    gate_far: [32.0, 85.0]
    range_blend_with_size_prior: 0.25
    default_object_height: 1.6


radar_sonar_tracker:
  ros__parameters:
    radar_topic: /mmwave_radar/scan
    # The tracker consumes modeled C3 messages. Raw Gazebo rays remain available for debugging.
    sonar_topic: ""
    sonar_detect_topic: /sonar/detect
    base_frame: base_link
    radar_x_offset: -0.35
    radar_y_offset: 0.0
    sonar_x_offset: 0.65
    sonar_min_points_for_valid_detect: 20
    sonar_default_confidence: 0.65
    sonar_detect_timeout_s: 2.0
    cluster_gap: 0.75
    min_cluster_points: 2
    max_tracking_range: 115.0
    association_gate: 4.5
    track_timeout: 4.0
    gated_points_topic: /gated_camera/detection_points
    uav_points_topic: /uav/gated_camera/detection_points
    pseudocolor_gated_points_topic: /gated_camera/pseudocolor/detection_points
    stf_gated_points_topic: /gated_camera/stf_detection_points
    bev_gated_points_topic: /gated_camera/bev_detection_points
    ais_topic: /ais/targets
    camera_fusion_timeout: 0.8
    uav_fusion_timeout: 1.2
    min_camera_confidence: 0.15
    ais_confidence: 0.88
    min_ais_confidence: 0.45

c3_multimodal_buffer_fusion:
  ros__parameters:
    base_frame: base_link
    usv_model_name: wamv
    radar_topics:
      - /mmwave/front/h10m/detections
      - /mmwave/right/h10m/detections
      - /mmwave/back/h10m/detections
      - /mmwave/left/h10m/detections
      - /mmwave/front/h4m/detections
      - /mmwave/right/h4m/detections
      - /mmwave/back/h4m/detections
      - /mmwave/left/h4m/detections
      - /mmwave/front/h1p9m/detections
      - /mmwave/right/h1p9m/detections
      - /mmwave/back/h1p9m/detections
      - /mmwave/left/h1p9m/detections
      - /mmwave/front/h1p5m/detections
      - /mmwave/right/h1p5m/detections
      - /mmwave/back/h1p5m/detections
      - /mmwave/left/h1p5m/detections
      - /mmwave/front/h1m/detections
      - /mmwave/right/h1m/detections
      - /mmwave/back/h1m/detections
      - /mmwave/left/h1m/detections
    # The fusion buffer receives the same delayed/noisy output as the tracker.
    sonar_detect_topic: /sonar/detect
    normal_camera_topic: /gated_camera/detection_points
    gated_camera_topic: /gated_camera/pseudocolor/detection_points
    stf_camera_topic: /gated_camera/stf_detection_points
    bev_topic: /gated_camera/bev_detection_points
    uav_gated_topic: /uav/gated_camera/detection_points
    depth_camera_detection_topic: /depth_camera/detection_points
    depth_topic: /depth_camera/dehazed_points
    model_states_topic: /model_states
    buffer_keep_s: 0.65
    sync_tolerance_s: 0.35
    sonar_fusion_window_frames: 3
    publish_rate_hz: 8.0
    max_points_per_cloud: 2500
    max_range_m: 160.0
    radar_min_range_m: 6.0
    close_range_m: 30.0
    heatmap_resolution_m: 1.0
    heatmap_x_min: 0.0
    heatmap_x_max: 150.0
    heatmap_y_min: -75.0
    heatmap_y_max: 75.0
    heatmap_threshold: 0.55
    heatmap_source_cell_cap: 1.25
    detected_suppression_radius: 9.0
    confirmation_radius: 10.0
    semantic_confirmation_radius: 15.0
    enable_spatial_fallback_confirmation: true
    spatial_confirmation_min_points: 4
    spatial_confirmation_min_sources: 2
    object_association_radius: 14.0
    detected_object_timeout_s: 30.0
    ekf_process_noise: 0.35
    ekf_measurement_noise: 0.9
    drone_goal_altitude: 24.0
    drone_goal_grid_m: 1.0
    drone_dispatch_min_range_m: 30.0
    evaluation_model_names:
      - moving_vessel
      - small_fishing_boat
      - survey_boat
      - service_boat
      - fishnet_buoy
      - floating_obstacle
      - drift_debris
      - floating_container
      - channel_buoy_north
      - channel_buoy_south
      - navigation_marker_port
      - navigation_marker_starboard
      - net_line_a
    evaluation_target_model_names:
      - moving_vessel

gated_camera_recognizer:
  ros__parameters:
    image_topic: /gated_camera/image_raw
    depth_topic: /depth_camera/depth/image_raw
    camera_info_topic: /gated_camera/camera_info
    output_prefix: gated_camera
    frame_id: gated_camera_link
    detection_input: raw
    yolo_model_path: "" # sim.launch.py sets src/usv_bringup/models/best.onnx by default.
    yolo_input_width: 640
    yolo_input_height: 640
    yolo_nms_threshold: 0.45
    # Current src/usv_bringup/models/best.onnx metadata:
    # {0: moving_vessel, 1: service_boat, 2: research_platform,
    #  3: fishing_boat, 4: ship_far, 5: obstacle}.
    # Keep this list in the exact model output order; detection PointCloud2 class_id uses this order.
    class_names: [moving_vessel, service_boat, research_platform, fishing_boat, ship_far, obstacle]
    confidence_threshold: 0.10
    enable_dehaze: true
    dehaze_strength: 0.65
    dehaze_omega: 0.88
    dehaze_min_transmission: 0.18
    dehaze_depth_beta: 0.018
    base_frame: base_link
    camera_x_offset: 1.55
    camera_y_offset: 0.0
    camera_z_offset: 1.20
    camera_horizontal_fov: 1.20
    camera_fx: 0.0
    camera_fy: 0.0
    camera_cx: 0.0
    camera_cy: 0.0
    camera_calibration_width: 0.0
    camera_calibration_height: 0.0
    use_tf_transform: true
    use_camera_info: true
    depth_roi_shrink: 0.12
    bbox_support_grid_side: 3
    bbox_support_score_scale: 0.82
    process_stride: 1
    gate_near: [2.0, 18.0]
    gate_mid: [12.0, 42.0]
    gate_far: [32.0, 85.0]


<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760">
  <rect width="1260" height="760" fill="#edf4f6"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #10242b; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 24px; font-weight: 700; }
    .sub { font-size: 18px; fill: #38515a; }
    .card { fill: #ffffff; stroke: #b7c8ce; stroke-width: 2; }
    .water { fill: #b8d7df; }
    .dark { fill: #15191b; }
    .mast { fill: #d8d6ca; }
  </style>

  <text x="40" y="48" class="title">Gazebo model names and annotation classes</text>
  <text x="40" y="78" class="sub">Use these class names when labeling the 300 annotation images.</text>

  <g transform="translate(40 115)">
    <rect class="card" width="370" height="270" rx="8"/>
    <rect class="water" x="24" y="185" width="322" height="18" rx="9"/>
    <rect x="72" y="142" width="212" height="38" fill="#e6a917"/>
    <rect x="90" y="126" width="176" height="18" class="dark"/>
    <rect x="134" y="92" width="78" height="42" fill="#c73622"/>
    <rect x="150" y="106" width="42" height="12" fill="#0c3240"/>
    <rect x="225" y="55" width="10" height="82" class="mast"/>
    <text x="24" y="232" class="label">class: vessel</text>
    <text x="24" y="258" class="sub">moving_vessel, survey_boat, service_boat, cargo_ship_far, anchored_tanker</text>
  </g>

  <g transform="translate(445 115)">
    <rect class="card" width="370" height="270" rx="8"/>
    <rect class="water" x="24" y="185" width="322" height="18" rx="9"/>
    <rect x="92" y="148" width="150" height="30" fill="#126fb5"/>
    <rect x="122" y="118" width="62" height="34" fill="#ded8bc"/>
    <rect x="196" y="86" width="8" height="82" fill="#333"/>
    <line x1="202" y1="92" x2="280" y2="118" stroke="#333" stroke-width="3"/>
    <text x="24" y="232" class="label">class: fishing_boat</text>
    <text x="24" y="258" class="sub">small_fishing_boat</text>
  </g>

  <g transform="translate(850 115)">
    <rect class="card" width="370" height="270" rx="8"/>
    <rect class="water" x="24" y="185" width="322" height="18" rx="9"/>
    <rect x="162" y="95" width="46" height="90" rx="17" fill="#128039"/>
    <circle cx="185" cy="87" r="22" fill="#d6d120"/>
    <rect x="184" y="42" width="8" height="44" fill="#65665c"/>
    <text x="24" y="232" class="label">class: buoy</text>
    <text x="24" y="258" class="sub">fishnet_buoy, channel_buoy_*, navigation_marker_*, net_line_a</text>
  </g>

  <g transform="translate(40 425)">
    <rect class="card" width="370" height="270" rx="8"/>
    <rect class="water" x="24" y="185" width="322" height="18" rx="9"/>
    <rect x="164" y="92" width="48" height="92" rx="16" fill="#b01e17"/>
    <rect x="184" y="42" width="8" height="70" class="mast"/>
    <text x="24" y="232" class="label">class: floating_obstacle</text>
    <text x="24" y="258" class="sub">floating_obstacle</text>
  </g>

  <g transform="translate(445 425)">
    <rect class="card" width="370" height="270" rx="8"/>
    <rect class="water" x="24" y="185" width="322" height="18" rx="9"/>
    <rect x="92" y="148" width="130" height="34" transform="rotate(8 157 165)" fill="#74431f"/>
    <rect x="208" y="118" width="116" height="52" transform="rotate(-5 266 144)" fill="#d45721"/>
    <text x="24" y="232" class="label">class: debris_container</text>
    <text x="24" y="258" class="sub">drift_debris, floating_container</text>
  </g>

  <g transform="translate(850 425)">
    <rect class="card" width="370" height="270" rx="8"/>
    <rect class="water" x="24" y="185" width="322" height="18" rx="9"/>
    <rect x="92" y="142" width="186" height="38" fill="#767d80"/>
    <rect x="154" y="70" width="50" height="76" fill="#e1ddc7"/>
    <rect x="102" y="180" width="12" height="35" fill="#767d80"/>
    <rect x="256" y="180" width="12" height="35" fill="#767d80"/>
    <text x="24" y="232" class="label">class: platform</text>
    <text x="24" y="258" class="sub">research_platform</text>
  </g>
</svg>

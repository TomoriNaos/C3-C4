radar_sonar_tracker:
  ros__parameters:
    radar_topic: /mmwave_radar/scan
    # The tracker consumes modeled C3 messages. Raw Gazebo rays remain available for debugging.
    sonar_topic: ""
    sonar_detect_topic: /sonar/detect
    base_frame: base_link
    radar_x_offset: -0.35
    radar_y_offset: 0.0
    sonar_x_offset: 0.65
    sonar_min_points_for_valid_detect: 5
    sonar_default_confidence: 0.72
    sonar_detect_timeout_s: 2.0
    cluster_gap: 0.75
    min_cluster_points: 2
    max_tracking_range: 115.0
    association_gate: 4.5
    track_timeout: 120.0
    gated_points_topic: ""
    gated_points_topics:
      - /gated_camera/detection_points
      - /gated_camera/right/detection_points
      - /gated_camera/back/detection_points
      - /gated_camera/left/detection_points
    uav_points_topic: ""
    uav_points_topics:
      - /uav/gated_camera/detection_points
      - /uav/gated_camera/right/detection_points
      - /uav/gated_camera/back/detection_points
      - /uav/gated_camera/left/detection_points
    uav_depth_points_topics:
      - /uav/depth_camera/detection_points
      - /uav/depth_camera/right/detection_points
      - /uav/depth_camera/back/detection_points
      - /uav/depth_camera/left/detection_points
    uav_observation_active_topic: /uav/observation/active
    require_uav_observation_active: true
    pseudocolor_gated_points_topic: /gated_camera/pseudocolor/detection_points
    stf_gated_points_topic: /gated_camera/stf_detection_points
    bev_gated_points_topic: /gated_camera/bev_detection_points
    ais_topic: /ais/targets
    camera_fusion_timeout: 0.8
    uav_fusion_timeout: 1.2
    # Main camera can acquire a target at 30%; UAV close inspection starts at 15%.
    min_camera_confidence: 0.30
    min_uav_camera_confidence: 0.15
    camera_detection_cluster_radius: 4.0
    tracker_frame_id: world
    max_tracks_per_class: 2
    max_track_misses: 400
    class_replacement_margin: 0.05
    mahalanobis_gate: 3.0
    velocity_gate_mps: 1.0
    feature_similarity_gate: 0.70
    ais_confidence: 0.90
    min_ais_confidence: 0.40
    # AIS refreshes any visual track after spatial/MMSI association. Only the
    # configured target class may create a track without prior YOLO evidence.
    ais_can_create_tracks: false
    ais_can_create_target_tracks: true
    ais_target_class_ids: [0.0]
    ais_maintenance_gate_m: 45.0

c3_multimodal_buffer_fusion:
  ros__parameters:
    base_frame: base_link
    usv_model_name: wamv
    radar_topics:
      - /mmwave/front/h3m/detections
      - /mmwave/right/h3m/detections
      - /mmwave/back/h3m/detections
      - /mmwave/left/h3m/detections
      - /mmwave/front/h4m/detections
      - /mmwave/right/h4m/detections
      - /mmwave/back/h4m/detections
      - /mmwave/left/h4m/detections
      - /mmwave/front/h1p9m/detections
      - /mmwave/right/h1p9m/detections
      - /mmwave/back/h1p9m/detections
      - /mmwave/left/h1p9m/detections
    # The fusion buffer receives the same delayed/noisy output as the tracker.
    sonar_detect_topic: /sonar/detect
    normal_camera_topic: ""
    normal_camera_topics:
      - /gated_camera/detection_points
      - /gated_camera/right/detection_points
      - /gated_camera/back/detection_points
      - /gated_camera/left/detection_points
    gated_camera_topic: ""
    stf_camera_topic: /gated_camera/stf_detection_points
    bev_topic: /gated_camera/bev_detection_points
    uav_gated_topic: ""
    uav_gated_topics:
      - /uav/gated_camera/detection_points
      - /uav/gated_camera/right/detection_points
      - /uav/gated_camera/back/detection_points
      - /uav/gated_camera/left/detection_points
    # A second UAV YOLO path uses raw RGB with the same depth image for ranging.
    uav_depth_topics:
      - /uav/depth_camera/detection_points
      - /uav/depth_camera/right/detection_points
      - /uav/depth_camera/back/detection_points
      - /uav/depth_camera/left/detection_points
    uav_observation_active_topic: /uav/observation/active
    require_uav_observation_active: true
    depth_camera_detection_topic: /depth_camera/detection_points
    depth_topic: /depth_camera/dehazed_points
    model_states_topic: /model_states
    buffer_keep_s: 1.20
    sync_tolerance_s: 0.80
    sonar_fusion_window_frames: 5
    publish_rate_hz: 8.0
    # Dashboard-only RGB diagnostics are rate-limited independently of fusion.
    diagnostic_image_rate_hz: 3.0
    max_points_per_cloud: 2500
    # Radar display is clustered independently from the raw radar data used by
    # heatmap inference, so RViz stays readable without hiding true returns.
    radar_display_max_points: 100
    radar_display_cluster_radius_m: 3.0
    radar_display_min_cluster_points: 2
    radar_display_max_points_per_cluster: 6
    max_range_m: 160.0
    # The converter now suppresses near-field sea clutter itself, so close
    # radar target returns can stay visible in fusion diagnostics.
    radar_min_range_m: 1.0
    # Internal mmWave prefilter before heatmap/tracking: uses range zones,
    # SNR/power scoring, radial velocity, and a local OS-CFAR approximation.
    radar_point_filter_enabled: true
    radar_filter_zone_a_max_m: 1.0
    radar_filter_zone_b_max_m: 100.0
    radar_filter_zone_c_max_m: 300.0
    radar_filter_zone_b_min_snr: 0.4
    radar_filter_zone_c_min_snr: 0.3
    radar_filter_zone_d_min_snr: 0.3
    radar_filter_zone_b_min_power: 0.0005
    radar_filter_zone_c_min_power: 0.0003
    radar_filter_zone_d_min_power: 0.0002
    radar_filter_min_point_score: 0.8
    radar_filter_history_frames: 3
    radar_filter_fail_open: true
    radar_filter_local_cfar_enabled: true
    radar_filter_local_range_bin_m: 5.0
    radar_filter_local_azimuth_bin_deg: 1.0
    radar_filter_local_guard_cells: 1
    radar_filter_local_train_cells: 3
    radar_filter_local_os_quantile: 0.75
    radar_filter_local_cfar_scale: 1.25
    # Keep near-hull wake clutter visible for diagnostics but prevent it from
    # dominating the UAV-search heatmap.
    radar_near_heatmap_radius_m: 50.0
    radar_near_heatmap_min_weight: 0.03
    close_range_m: 30.0
    heatmap_resolution_m: 1.0
    heatmap_x_min: 0.0
    heatmap_x_max: 150.0
    heatmap_y_min: -75.0
    heatmap_y_max: 75.0
    # Point-cloud diagnostic images use a separate full-surround view.  The
    # forward-only heatmap above remains the UAV-search coordinate system.
    pointcloud_visual_x_min: -150.0
    pointcloud_visual_x_max: 150.0
    pointcloud_visual_y_min: -150.0
    pointcloud_visual_y_max: 150.0
    heatmap_threshold: 0.55
    heatmap_source_cell_cap: 1.25
    # Preserve the 1 m grid while fusing neighbouring modal points into clusters.
    heatmap_cluster_sigma_m: 1.0
    heatmap_cluster_radius_m: 2.0
    heatmap_peak_nms_radius_m: 5.0
    heatmap_max_peaks: 5
    # vote preserves the original rule-based heatmap. neural runs
    # pos_confidence_best.onnx using only the buffered sensor observations.
    heatmap_mode: vote
    neural_heatmap_model_path: ""
    neural_heatmap_threshold: 0.50
    neural_heatmap_nms_kernel: 5
    heatmap_temporal_smoothing_alpha: 0.70
    neural_max_points_per_modality: 1200
    # auto tries CUDA first and falls back to CPU. cuda requires a GPU-enabled
    # ONNX Runtime distribution; cpu disables CUDA probing explicitly.
    neural_execution_provider: auto
    neural_intra_op_threads: 4
    neural_cuda_device_id: 0
    neural_depth_optical_frame: true
    neural_depth_x_offset_m: 1.65
    neural_depth_y_offset_m: 0.0
    neural_depth_z_offset_m: 0.98
    # SonarDetect carries a simulated beam footprint. Keep its delayed returns
    # long enough to fuse several pings without subscribing to ideal Gazebo rays.
    sonar_buffer_keep_s: 2.5
    sonar_sync_tolerance_s: 1.5
    # Neural mode filters only radar/sonar with sensor-space temporal evidence.
    # Camera and depth observations keep their existing semantic processing.
    neural_clutter_filter_enabled: true
    neural_clutter_cluster_radius_m: 2.5
    neural_clutter_min_cluster_points: 2
    neural_clutter_mahalanobis_gate: 9.21
    neural_clutter_measurement_noise_m: 2.0
    neural_clutter_velocity_noise_mps: 1.2
    neural_clutter_confirmation_interval_s: 0.30
    neural_clutter_min_track_hits: 3
    neural_clutter_track_timeout_s: 2.0
    neural_clutter_residual_mean_max: 6.0
    neural_clutter_cfar_scale: 1.10
    # Stricter radar-only thresholds. Sonar keeps the general values above.
    neural_radar_min_cluster_points: 3
    neural_radar_mahalanobis_gate: 6.0
    neural_radar_confirmation_interval_s: 0.45
    neural_radar_min_track_hits: 4
    neural_radar_residual_mean_max: 3.5
    neural_radar_cfar_scale: 1.35
    detected_suppression_radius: 9.0
    confirmation_radius: 10.0
    semantic_confirmation_radius: 15.0
    enable_spatial_fallback_confirmation: true
    spatial_confirmation_min_points: 10
    spatial_confirmation_min_sources: 2
    spatial_confirmation_min_frames: 3
    spatial_confirmation_max_spread_m: 4.0
    spatial_confirmation_association_m: 3.0
    spatial_confirmation_timeout_s: 1.2
    object_association_radius: 14.0
    # Existing objects are refreshed by compatible camera/UAV semantic points,
    # even when that object is not this frame's heatmap maximum.
    object_semantic_maintenance_radius: 12.0
    object_semantic_maintenance_min_confidence: 0.22
    detected_object_timeout_s: 30.0
    ekf_process_noise: 0.35
    ekf_measurement_noise: 0.9
    # Transit commands stay low enough for useful gated-camera image scale.
    drone_goal_altitude: 10.0
    drone_goal_grid_m: 1.0
    # The USV handles targets inside 30 m.  The UAV is dispatched only to
    # the strongest heatmap candidate outside that perimeter.
    drone_dispatch_min_range_m: 30.0
    # A world-frame heatmap cluster must remain spatially stable for seven seconds before the
    # UAV receives a new mission. Localization is selected hierarchically:
    # 5 m coarse cell -> 2 m medium cell -> 1 m final cell.
    uav_goal_stability_window_s: 7.0
    uav_goal_update_period_s: 7.0
    uav_goal_min_stability_ratio: 0.65
    uav_goal_min_samples: 12
    # Keep world-frame alpha-beta records of inspected heatmap clusters.
    inspection_cluster_association_m: 7.0
    inspection_cluster_memory_s: 600.0
    # UAV observes one stable peak for this long before the next peak is queued.
    uav_inspection_dwell_s: 4.0
    # c3_gate classes: moving_vessel, service_boat, research_platform,
    # fishing_boat, ship_far, obstacle.
    uav_confirmation_class_ids: [0.0]
    # Rank deduplicated UAV visual objects. A 15% object is worth approaching;
    # a 35% result can directly hand the target to the main controller.
    uav_confirmation_min_confidence: 0.35
    uav_direct_confirmation_min_confidence: 0.35
    main_direct_confirmation_min_confidence: 0.30
    # Weighted UAV recognition: gated three-colour YOLO is preferred; raw RGB
    # plus depth YOLO supplies an independent visual vote.
    uav_gated_confidence_weight: 1.20
    uav_depth_confidence_weight: 0.90
    # The top ranked object is dispatched only when its fused YOLO score is >=15%.
    uav_dispatch_min_yolo_confidence: 0.15
    uav_dispatch_association_m: 12.0
    visual_candidate_cluster_radius_m: 4.0
    evaluation_model_names:
      - moving_vessel
      - small_fishing_boat
      - survey_boat
      - service_boat
      - fishnet_buoy
      - floating_obstacle
      - drift_debris
      - floating_container
      - channel_buoy_north
      - channel_buoy_south
      - navigation_marker_port
      - navigation_marker_starboard
      - net_line_a
    evaluation_target_model_names:
      - moving_vessel

gated_camera_recognizer:
  ros__parameters:
    image_topic: /gated_camera/image_raw
    depth_topic: /gated_camera/depth/image_raw
    camera_info_topic: /gated_camera/camera_info
    output_prefix: gated_camera
    frame_id: gated_camera_link
    detection_input: range_view
    yolo_model_path: "" # sim.launch.py sets src/usv_bringup/models/gated_camera.onnx by default.
    yolo_input_width: 640
    yolo_input_height: 640
    yolo_nms_threshold: 0.45
    # Current gated_camera.onnx metadata:
    # {0: moving_vessel, 1: service_boat, 2: research_platform,
    #  3: fishing_boat, 4: ship_far, 5: obstacle}.
    # Keep this list in the exact model output order; detection PointCloud2 class_id uses this order.
    class_names: [moving_vessel, service_boat, research_platform, fishing_boat, ship_far, obstacle]
    confidence_threshold: 0.08
    enable_dehaze: true
    dehaze_strength: 0.65
    dehaze_omega: 0.88
    dehaze_min_transmission: 0.18
    dehaze_depth_beta: 0.018
    base_frame: base_link
    camera_x_offset: 0.78
    camera_y_offset: 0.0
    camera_z_offset: -0.12
    camera_horizontal_fov: 1.20
    camera_fx: 0.0
    camera_fy: 0.0
    camera_cx: 0.0
    camera_cy: 0.0
    camera_calibration_width: 0.0
    camera_calibration_height: 0.0
    use_tf_transform: true
    use_camera_info: true
    depth_roi_shrink: 0.12
    bbox_support_grid_side: 3
    bbox_support_score_scale: 0.82
    process_stride: 1
    gate_near: [2.0, 18.0]
    gate_mid: [12.0, 42.0]
    gate_far: [32.0, 85.0]


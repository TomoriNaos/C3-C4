uav_patrol_controller:
  ros__parameters:
    model_name: scout_uav
    update_rate: 8.0
    center_x: 42.0
    center_y: 0.0
    # Keep every operating mode low enough that nearby vessels fill the frame.
    altitude: 5.0
    radius_x: 10.0
    radius_y: 10.0
    angular_speed: 0.120
    patrol_speed: 1.40
    # The optical mount is mildly down-looking. Patrol stays shallow enough to
    # see objects ahead, while observation pitches down toward the close target.
    camera_pitch: -0.25
    patrol_camera_pitch: -0.25
    camera_mount_pitch: 0.55
    camera_pitch_min: -0.35
    camera_pitch_max: 0.45
    usv_model_name: wamv
    model_states_topic: /model_states
    external_goal_topic: /c3/drone/goal
    assist_request_topic: /uav/assist_request
    c3_detected_topic: /c3/detected_objects
    track_status_topic: /tracked_objects_text
    # C3 updates stable UAV goals every seven seconds; retain the last mission
    # long enough for the flight controller to reach its observation point.
    external_goal_timeout: 12.0
    assist_goal_timeout: 3.0
    uav_track_timeout: 45.0
    tracker_target_max_misses: 80
    external_goal_speed: 3.2
    goal_arrive_radius: 2.0
    # The USV identifies targets inside 30 m.  UAV patrol and heatmap observation
    # remain outside this perimeter, then enable UAV-camera detections for tracking.
    observation_standoff_m: 3.0
    observation_altitude: 5.0
    observation_arrive_radius: 1.2
    observation_active_topic: /uav/observation/active
    minimum_operating_range_m: 30.0
    # This Bool represents a future low-battery event. Only return mode may fly inside 30 m.
    return_requested_topic: /uav/return_requested
    return_altitude: 5.0
    # "px4" is the real flight-control path; sim.launch.py uses the modeled Classic backend.
    control_backend: px4
    px4_goal_topic: /uav/offboard_goal
    px4_pose_topic: /px4/vehicle_pose
    gazebo_sim_goal_topic: /uav/sim/command
    gazebo_sim_pose_topic: /uav/sim/estimated_pose

uav_flight_simulator:
  ros__parameters:
    model_name: scout_uav
    model_states_topic: /model_states
    command_topic: /uav/sim/command
    estimated_pose_topic: /uav/sim/estimated_pose
    estimated_twist_topic: /uav/sim/estimated_twist
    status_topic: /uav/sim/status
    update_rate_hz: 30.0
    command_delay_s: 0.22
    command_timeout_s: 1.5
    max_speed_mps: 10.0
    position_speed_gain: 1.44
    max_climb_rate_mps: 2.0
    max_accel_mps2: 4.8
    velocity_time_constant_s: 0.45
    max_yaw_rate_rps: 1.25
    yaw_time_constant_s: 0.45
    wind_speed_mps: 0.65
    wind_direction_rad: 0.35
    wind_gust_mps: 0.28
    wind_gust_hz: 0.16
    position_noise_stddev_m: 0.18
    altitude_noise_stddev_m: 0.10
    yaw_noise_stddev_rad: 0.025

px4_offboard_bridge:
  ros__parameters:
    input_goal_topic: /uav/offboard_goal
    vehicle_pose_topic: /px4/vehicle_pose
    setpoint_hz: 20.0
    prestream_setpoints: 20
    # Keep vehicle arming and Offboard entry explicit until SITL/airframe checks pass.
    auto_arm: false
    auto_enter_offboard: false
    vehicle_system_id: 1
    vehicle_component_id: 1

usv_target_follower:
  ros__parameters:
    enabled: true
    model_name: wamv
    pose_topic: /tracked_object_poses
    track_status_topic: /tracked_objects_text
    c3_detected_topic: /c3/detected_objects
    uav_assist_topic: /uav/assist_request
    # Normal mode never reads another Gazebo model's pose. demo_mode is an
    # explicit opt-in for a stable presentation run only.
    model_states_topic: /model_states
    demo_mode: false
    demo_target_model_name: moving_vessel
    flight_controller_goal_topic: /usv/offboard_goal
    flight_controller_standoff_m: 7.0
    demo_target_confidence: 0.98
    demo_target_smoothing_tau_s: 1.2
    update_rate: 15.0
    max_speed: 2.20
    max_yaw_rate: 1.05
    desired_standoff: 7.0
    # A class-confirmed target is predicted through short sensor dropouts. This
    # is not permanent following: no measurement for 15 s releases the lock.
    target_timeout: 60.0
    track_status_timeout: 2.0
    max_follow_range: 170.0
    yaw_gain: 1.45
    speed_gain: 0.32
    waterline_z: 0.32
    startup_delay: 3.0
    target_lead_time: 1.8
    max_lead_distance: 6.0
    min_chase_speed: 0.80
    far_range_speed_boost: 0.55
    stale_target_speed_scale: 0.85
    target_lock_timeout: 60.0
    target_reacquire_gate: 22.0
    turn_slowdown_gain: 0.20
    # Smooth noisy relative bearings before changing hull yaw.  Unconfirmed
    # tracks cannot stop the vessel as obstacles.
    target_bearing_filter_tau_s: 7.0
    heading_deadband_rad: 0.06
    follow_class_id: 0.0
    follow_class_ids: [0.0]
    prefer_follow_class: true
    min_follow_confidence: 0.12
    min_track_hits: 3
    max_follow_track_misses: 80
    require_follow_class_for_acquisition: true
    # AIS/radar/sonar may maintain an acquired lock, but cannot create one by
    # themselves. First acquisition must come from a camera or C3 confirmation.
    require_visual_source_for_acquisition: true
    require_uav_source_for_initial_acquisition: true
    # Inside the camera-effective range, do not steer into a sector that has no
    # recent 360-degree ship-camera detection.
    require_camera_sector_confirmation: true
    camera_sector_gate_range_m: 80.0
    camera_sector_timeout_s: 2.0
    camera_sector_min_confidence: 0.20
    camera_detection_topics:
      - /gated_camera/detection_points
      - /gated_camera/right/detection_points
      - /gated_camera/back/detection_points
      - /gated_camera/left/detection_points
    obstacle_lookahead: 34.0
    obstacle_lateral_window: 13.0
    obstacle_clearance: 5.5
    hard_stop_distance: 8.0
    hard_stop_lateral: 2.4
    avoidance_gain: 0.85
    obstacle_slowdown_gain: 0.38
    min_avoidance_speed_scale: 0.50
    centered_obstacle_bias: 1.0
    avoidance_max_bearing_offset: 0.55
    avoidance_target_exclusion_radius_m: 9.0
    min_obstacle_confidence: 0.35
    min_obstacle_hits: 2

wave_buoyancy_node:
  ros__parameters:
    link_name: wamv::base_footprint
    water_level: 0.32
    wave_amplitude: 0.10
    update_rate: 0.5
    vertical_force_scale: 18.0
    torque_scale: 5.0

tracking_evaluator:
  ros__parameters:
    model_states_topic: /model_states
    track_status_topic: /tracked_objects_text
    usv_model_name: wamv
    target_model_names:
      - moving_vessel
      - small_fishing_boat
      - survey_boat
      - service_boat
    obstacle_model_names:
      - fishnet_buoy
      - floating_obstacle
      - drift_debris
      - floating_container
      - channel_buoy_north
      - channel_buoy_south
      - navigation_marker_port
      - navigation_marker_starboard
      - net_line_a
    match_gate: 7.0
    eval_range: 140.0
    track_timeout: 2.5
    cpa_horizon: 120.0
    publish_rate: 2.0

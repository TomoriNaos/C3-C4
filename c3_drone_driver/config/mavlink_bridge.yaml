# MAVLink桥接参数
mavlink_bridge_node:
  ros__parameters:
    # 链路状态判定参数
    heartbeat_hz: 1.0             # 心跳频率（Hz）
    link_degraded_s: 3.0          # 链路降级阈值（秒）
    link_lost_s: 8.0              # 链路丢失阈值（秒）

    # 状态发布参数
    status_hz: 1.0                # 状态发布频率（Hz）
    status_keepalive_s: 5.0       # 状态保活周期（秒）
    target_obs_valid_timeout_s: 2.0 # 目标观测有效时间（秒）

    # 预留项（当前Bridge仅做透传与链路状态）
    mission_cmd_default: 0        # 默认任务指令ID

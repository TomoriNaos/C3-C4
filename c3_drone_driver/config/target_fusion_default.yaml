# 目标融合参数
%YAML:1.0
---
# 时间同步参数
time_sync_threshold_s: 0.1    # 点云与检测时间同步阈值（秒）
pending_wait_s: 0.06          # 等待迟到点云时间（秒）
buffer_keep_s: 0.2            # 缓冲保留时长（秒）

# 目标与跟踪参数
default_confidence: 0.6       # 默认检测置信度
target_type_default: 0        # 默认目标类型
low_conf_threshold: 0.55      # 低置信阈值
smoothing_alpha: 0.35         # 轨迹平滑系数
max_tracking_loss_frames: 30  # 最大允许丢失帧数

# 云台指令参数
visual_cmd_gain: 1.0          # 视觉控制增益

# ROI 与图像参数
roi_margin_px: 16             # ROI扩展边界（像素）
image_width: 1280             # 图像宽度（像素）
image_height: 720             # 图像高度（像素）
min_roi_points: 20            # ROI内最少有效点数

# 深度过滤参数
depth_min: 0.5                # 最小有效深度（米）
depth_max: 120.0              # 最大有效深度（米）

# 观测噪声参数
tc_noise_std: 0.10            # 传统相机点云噪声标准差
gc_noise_std: 0.05            # 门控相机点云噪声标准差

# 置信度融合权重
confidence_weight_detection: 0.5
confidence_weight_cluster: 0.2
confidence_weight_stability: 0.3
